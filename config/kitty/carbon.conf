# Carbon g100 — IBM Plex Mono on #161616, Oxocarbon ANSI colors.
font_family IBM Plex Mono
bold_font IBM Plex Mono SemiBold
italic_font IBM Plex Mono Italic
bold_italic_font auto
font_size 11
modify_font cell_height 112%
background #161616
foreground #f2f4f8
selection_background #525252
selection_foreground #f2f4f8
url_color #78a9ff
cursor #f2f4f8
cursor_text_color #161616
cursor_shape block
cursor_blink_interval 0
cursor_trail 1
background_opacity 1
window_padding_width 12 16
active_border_color #78a9ff
inactive_border_color #393939
draw_minimal_borders yes
tab_bar_edge top
tab_bar_style separator
tab_separator ""
tab_bar_margin_height 0 0
tab_title_template " {index}  {title} "
active_tab_title_template " {index}  {title} "
active_tab_foreground #f2f4f8
active_tab_background #393939
active_tab_font_style normal
inactive_tab_foreground #a8a8a8
inactive_tab_background #262626
inactive_tab_font_style normal
tab_bar_background #262626
bell_on_tab no
mark1_background #78a9ff
mark2_background #be95ff
mark3_background #ff7eb6
initial_window_width 1000
initial_window_height 650
remember_window_size no
# black / red / green / yellow / blue / magenta / cyan / white
color0 #262626
color8 #6f6f6f
color1 #ee5396
color9 #ff7eb6
color2 #42be65
color10 #6fdc8c
color3 #ff832b
color11 #ffb784
color4 #78a9ff
color12 #a6c8ff
color5 #be95ff
color13 #d4bbff
color6 #3ddbd9
color14 #82cfff
color7 #c6c6c6
color15 #f2f4f8

# Keep the block cursor at the Fish prompt too.
shell_integration no-cursor
