# Carbon · Hyprlock
# Static background (header, sign-in tile, status bar) is drawn by ~/.config/hypr/hyprlock/render.py.
# Positions follow a 1920x1080 artboard, relative to the center (y grows upward). Colors use ## (hyprlang escape).

source = ~/.cache/carbon-lock/backgrounds.conf

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 1500
    immediate_render = true
}

# Carbon "productive" motion: quick, no bounce
animations {
    enabled = true
    bezier = productive, 0.2, 0, 0.38, 0.9
    animation = fadeIn, 1, 2, productive
    animation = fadeOut, 1, 2, productive
    animation = inputFieldColors, 1, 1, productive
    animation = inputFieldFade, 1, 1, productive
    animation = inputFieldDots, 1, 1, productive
}

# ── clock: Plex Sans Light display type ─────────────────────────────
label {
    text = $TIME
    font_family = IBM Plex Sans Light
    font_size = 120
    color = rgb(F2F4F8)
    position = 0, 160
    halign = center
    valign = center
}

label {
    text = cmd[update:30000] ~/.config/hypr/hyprlock/info date
    font_family = IBM Plex Mono
    font_size = 11
    color = rgb(A8A8A8)
    position = 0, 56
    halign = center
    valign = center
}

# ── password field over the drawn text input (tile top = artboard y 540) ──
input-field {
    size = 432, 47
    position = 0, -121
    halign = center
    valign = center
    rounding = 0
    outline_thickness = 2
    outer_color = rgb(393939)
    inner_color = rgb(393939)
    check_color = rgb(78A9FF)
    fail_color = rgb(EE5396)
    capslock_color = rgb(FF832B)
    font_color = rgb(F2F4F8)
    font_family = IBM Plex Mono
    dots_size = 0.22
    dots_spacing = 0.6
    dots_center = false
    dots_rounding = 0
    placeholder_text = <span foreground="##6F6F6F">digite a senha</span>
    check_text = <span foreground="##78A9FF">verificando…</span>
    fail_text = <span foreground="##EE5396">senha incorreta · tentativa $ATTEMPTS</span>
    fade_on_empty = false
    zindex = 1
}

# ── header right: lock time; status bar right: battery ──────────────
label {
    text = cmd[update:0] ~/.config/hypr/hyprlock/info since
    font_family = IBM Plex Mono
    font_size = 9
    color = rgb(A8A8A8)
    position = -16, -9
    halign = right
    valign = top
}

label {
    text = cmd[update:30000] ~/.config/hypr/hyprlock/info bat
    font_family = IBM Plex Mono
    font_size = 9
    color = rgb(C6C6C6)
    position = -16, 9
    halign = right
    valign = bottom
}
