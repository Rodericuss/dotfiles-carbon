<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>carbon</title>
<style>
*{box-sizing:border-box}html{background:#161616;color:#f2f4f8;font:14px "IBM Plex Sans",system-ui,sans-serif}body{margin:0;min-height:100vh;display:grid;place-items:center}
main{width:min(640px,88vw);padding:48px 0}#date{font:12px "IBM Plex Mono",monospace;color:#a8a8a8}
time{display:block;font-size:96px;font-weight:300;letter-spacing:-1px;line-height:1.1;margin:8px 0 40px}
label{display:block;font-size:12px;color:#c6c6c6;margin-bottom:8px}
.entry{display:flex;gap:12px;align-items:center;background:#262626;border-bottom:1px solid #6f6f6f;padding:0 16px;height:48px}
.entry:focus-within{outline:2px solid #f2f4f8;outline-offset:-2px;border-bottom-color:transparent}
.entry span{font-family:"IBM Plex Mono",monospace;color:#78a9ff}
input{border:0;outline:0;background:none;color:#f2f4f8;font:16px "IBM Plex Sans",sans-serif;width:100%;caret-color:#f2f4f8}input::placeholder{color:#6f6f6f}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:32px;background:#393939;border:1px solid #393939}
a{display:block;color:#f2f4f8;text-decoration:none;background:#262626;padding:16px;min-height:96px;position:relative}
a small{display:block;font:12px "IBM Plex Mono",monospace;color:#a8a8a8;margin-bottom:24px}
a::after{content:"→";position:absolute;right:16px;bottom:16px;color:#78a9ff}
a:hover{background:#333333}a:focus-visible{outline:2px solid #f2f4f8;outline-offset:-2px}
a:nth-child(1) small{color:#78a9ff}a:nth-child(2) small{color:#be95ff}a:nth-child(3) small{color:#ff7eb6}a:nth-child(4) small{color:#3ddbd9}
footer{font:600 13px "IBM Plex Sans",sans-serif;color:#161616;background:#ee5396;display:inline-block;padding:4px 10px;margin-top:40px}
@media(max-width:560px){time{font-size:64px}nav{grid-template-columns:repeat(2,1fr)}}
</style><main><div id="date"></div><time id="clock"></time><form action="https://www.google.com/search" method="get"><label for="query">Pesquisar</label><div class="entry"><span>❯</span><input id="query" name="q" autocomplete="off" autofocus placeholder="digite e tecle enter"></div></form><nav><a href="https://github.com"><small>01</small>github</a><a href="https://wiki.hypr.land"><small>02</small>hypr wiki</a><a href="https://herdr.dev"><small>03</small>herdr</a><a href="https://claude.ai"><small>04</small>claude</a></nav><footer>carbon workstation</footer></main><script>/* Grab the search box once the tab is shown; Firefox may keep focus in the URL bar until then. */const q=document.getElementById("query");const grab=()=>{if(document.activeElement!==q)q.focus()};addEventListener("load",grab);addEventListener("pageshow",grab);document.addEventListener("visibilitychange",()=>{if(!document.hidden)grab()});
function tick(){const d=new Date();document.getElementById('date').textContent=d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});const t=document.getElementById('clock');t.textContent=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});t.dateTime=d.toISOString()}tick();setInterval(tick,1000);
</script></html>
